<table>
    <thead>
        <tr>
            <th>Lp</th>
            <th>#</th>
            <th>Nazwisko, imię</th>
            <th>Login</th>
            <th>Wiek</th>
            <th>Akcje</th>
        </tr>
    </thead>
    <tbody>
        @for(user of tabUsers; track user.id; let i = $index) {
            <tr>
                <td>{{i + 1}}</td>
                <td>{{user.id}}</td>
                <td>{{user.name}}</td>
                <td>{{user.login}}</td>
                <td>{{user.age}}</td>
                <td>
                    <button [routerLink]="['/users', user.id]">szczegóły</button>
                </td>
            </tr>
        }
    </tbody>
</table>
